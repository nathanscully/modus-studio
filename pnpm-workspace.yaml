# pnpm supply-chain hardening. This is a single-package repo (no workspaces),
# but pnpm reads these install-policy settings from pnpm-workspace.yaml.
packages: []

# Don't install any package version published less than 7 days ago. A
# compromised release is usually caught and yanked within that window, so the
# delay blunts "install a freshly-published malicious version" attacks.
minimumReleaseAge: 10080 # minutes = 7 days

# Refuse a version whose trust evidence is weaker than that of an
# earlier-published version of the same package. Comparison is by publish date,
# not semver, so a takeover cannot launder itself through any version number.
trustPolicy: no-downgrade

# Chronological comparison misreads maintenance releases on an old major line.
# semver 7.5.4 (2023-07-07) shipped provenance; 6.3.1 (2023-07-10) is a 6.x
# backport published after it with none, so it reads as a downgrade. Pulled in
# by @babel/core; no advisories against it.
trustPolicyExclude:
  - semver@6.3.1

                    - code: ";;; modus-operandi-theme.el --- Elegant, highly legible theme with a white background. -*- lexical-binding:t -*- ;; Generated by the Modus Theme Generator. Built on top of the modus-themes. ;; Requires the `modus-themes' package (bundled with Emacs >= 30, or installable ;; from GNU ELPA) to be available. ;;; Code: (eval-and-compile (unless (and (fboundp 'require-theme) load-file-name (equal (file-name-directory load-file-name) (expand-file-name \"themes/\" data-directory)) (require-theme 'modus-themes t)) (require 'modus-themes)) ;;;###theme-autoload (deftheme modus-operandi \"Elegant, highly legible theme with a white background.\" :background-mode 'light :kind 'color-scheme :family 'modus) (defconst modus-operandi-palette '( ;;; Basic values (bg-main \"#ffffff\") (bg-dim \"#f2f2f2\") (fg-main \"#000000\") (fg-dim \"#595959\") (fg-alt \"#193668\") (bg-active \"#c4c4c4\") (bg-inactive \"#e0e0e0\") (border \"#9f9f9f\") ;;; Common hues (red \"#a60000\") (red-warmer \"#972500\") (red-cooler \"#a0132f\") (red-faint \"#7f0000\") (red-intense \"#d00000\") (green \"#006800\") (green-warmer \"#316500\") (green-cooler \"#00663f\") (green-faint \"#2a5045\") (green-intense \"#008900\") (yellow \"#6f5500\") (yellow-warmer \"#884900\") (yellow-cooler \"#7a4f2f\") (yellow-faint \"#624416\") (yellow-intense \"#808000\") (blue \"#0031a9\") (blue-warmer \"#3548cf\") (blue-cooler \"#0000b0\") (blue-faint \"#003497\") (blue-intense \"#0000ff\") (magenta \"#721045\") (magenta-warmer \"#8f0075\") (magenta-cooler \"#531ab6\") (magenta-faint \"#7c318f\") (magenta-intense \"#dd22dd\") (cyan \"#005e8b\") (cyan-warmer \"#3f578f\") (cyan-cooler \"#005f5f\") (cyan-faint \"#005077\") (cyan-intense \"#008899\") ;;; Uncommon accent foregrounds (rust \"#8a290f\") (gold \"#6c501c\") (olive \"#4c6000\") (slate \"#2f3f83\") (indigo \"#4a3a8a\") (maroon \"#731c52\") (pink \"#7b435c\") ;;; Intense backgrounds (bg-red-intense \"#ff8f88\") (bg-green-intense \"#8adf80\") (bg-yellow-intense \"#f3d000\") (bg-blue-intense \"#bfc9ff\") (bg-magenta-intense \"#dfa0f0\") (bg-cyan-intense \"#a4d5f9\") ;;; Subtle backgrounds (bg-red-subtle \"#ffcfbf\") (bg-green-subtle \"#b3fabf\") (bg-yellow-subtle \"#fff576\") (bg-blue-subtle \"#ccdfff\") (bg-magenta-subtle \"#ffddff\") (bg-cyan-subtle \"#bfefff\") ;;; Nuanced backgrounds (bg-red-nuanced \"#ffe8e8\") (bg-green-nuanced \"#e0f6e0\") (bg-yellow-nuanced \"#f8f0d0\") (bg-blue-nuanced \"#ecedff\") (bg-magenta-nuanced \"#f8e6f5\") (bg-cyan-nuanced \"#e0f2fa\") ;;; Uncommon background/foreground pairs (bg-clay \"#f1c8b5\") (fg-clay \"#63192a\") (bg-ochre \"#f0e3c0\") (fg-ochre \"#573a30\") (bg-lavender \"#dfcdfa\") (fg-lavender \"#443379\") (bg-sage \"#c0e7d4\") (fg-sage \"#124b41\") ;;; Graph colors (bg-graph-red-0 \"#ef7969\") (bg-graph-red-1 \"#ffaab4\") (bg-graph-green-0 \"#45c050\") (bg-graph-green-1 \"#75ef30\") (bg-graph-yellow-0 \"#ffcf00\") (bg-graph-yellow-1 \"#f9ff00\") (bg-graph-blue-0 \"#7f90ff\") (bg-graph-blue-1 \"#a6c0ff\") (bg-graph-magenta-0 \"#e07fff\") (bg-graph-magenta-1 \"#fad0ff\") (bg-graph-cyan-0 \"#70d3f0\") (bg-graph-cyan-1 \"#afefff\") ;;; Special purpose backgrounds (bg-completion \"#c0deff\") (bg-popup \"#f3f3f3\") (bg-hover \"#b2e4dc\") (bg-hover-secondary \"#f5d0a0\") (bg-hl-line \"#dae5ec\") (bg-region \"#bdbdbd\") (bg-char-0 \"#7feaff\") (bg-char-1 \"#ffaaff\") (bg-char-2 \"#dff000\") ;;; Mode line (bg-mode-line-active \"#c8c8c8\") (border-mode-line-active \"#5a5a5a\") (bg-mode-line-inactive \"#e6e6e6\") (fg-mode-line-inactive \"#585858\") (border-mode-line-inactive \"#a3a3a3\") (modeline-err \"#7f0000\") (modeline-warning \"#5f0070\") (modeline-info \"#002580\") ;;; Tab bar (bg-tab-bar \"#dfdfdf\") (bg-tab-current \"#ffffff\") (bg-tab-other \"#c2c2c2\") ;;; Diffs (bg-added \"#c1f2d1\") (bg-added-faint \"#d8f8e1\") (bg-added-refine \"#aee5be\") (bg-added-fringe \"#6cc06c\") (fg-added \"#005000\") (fg-added-intense \"#006700\") (bg-changed \"#ffdfa9\") (bg-changed-faint